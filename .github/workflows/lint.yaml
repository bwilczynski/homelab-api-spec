name: lint

on:
  pull_request:
    paths:
      - "openapi/**"
      - ".spectral.yaml"
      - "redocly.yaml"
      - "Makefile"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/lint.yaml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spectral:
    name: spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      - name: Spectral lint (bundled)
        run: make lint-spectral-bundled

  redocly:
    name: redocly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
        with:
          install_args: node
      - name: Redocly lint
        run: make lint-redocly
      - name: Bundle (smoke test)
        run: make bundle

  breaking-changes:
    name: breaking-changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: oasdiff breaking changes
        run: make breaking BASE=${{ github.event.pull_request.base.sha }}
