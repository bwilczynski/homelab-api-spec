allOf:
  - $ref: "./NetworkDevice.yaml"
  - type: object
    description: Detailed information about a network device, including model, firmware, and uptime.
    properties:
      model:
        type: string
        description: Device model identifier as reported by the controller.
        example: "U6-Lite"
      firmwareVersion:
        type: string
        description: Installed firmware version.
        example: "6.6.77.14522"
      uptime:
        type: integer
        description: Seconds since the device last (re)connected to the controller.
        example: 86400
    required:
      - model
      - firmwareVersion
      - uptime
