type: object
description: Network throughput for a single interface.
properties:
  name:
    type: string
    description: Interface name as reported by the OS.
    example: eth0
  rxBytesPerSec:
    allOf:
      - $ref: "../units/BytesPerSec.yaml"
    description: Receive throughput in bytes per second.
    example: 125000
  txBytesPerSec:
    allOf:
      - $ref: "../units/BytesPerSec.yaml"
    description: Transmit throughput in bytes per second.
    example: 50000
required:
  - name
  - rxBytesPerSec
  - txBytesPerSec
