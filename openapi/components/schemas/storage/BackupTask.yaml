type: object
description: |
  A backup task from a NAS backup service (e.g. Hyper Backup,
  Glacier Backup). Represents a configured backup job and the
  outcome of its most recent run.
properties:
  id:
    type: string
    description: |
      Globally unique backup task identifier in the form
      `{device}.{taskId}`. Use this value directly in path parameters.
    example: "nas-1.1"
  name:
    type: string
    description: Human-readable task name as configured in the backup service.
    example: "Daily NAS Backup"
  device:
    type: string
    description: Identifier of the backend device that owns this task.
    example: nas-1
  type:
    type: string
    description: |
      Backup service type. Values depend on the backend (e.g.
      `hyperBackup`, `glacierBackup`).
    example: hyperBackup
  status:
    $ref: "./BackupTaskStatus.yaml"
  lastResult:
    $ref: "./BackupTaskResult.yaml"
required:
  - id
  - name
  - device
  - type
  - status
  - lastResult
