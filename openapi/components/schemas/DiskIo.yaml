type: object
description: Disk I/O counters for a single disk.
properties:
  name:
    type: string
    description: Disk device name as reported by the OS.
    example: sda
  readOpsPerSec:
    type: integer
    description: Read operations per second.
    example: 42
  writeOpsPerSec:
    type: integer
    description: Write operations per second.
    example: 18
required:
  - name
  - readOpsPerSec
  - writeOpsPerSec
