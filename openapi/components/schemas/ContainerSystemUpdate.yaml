allOf:
  - $ref: "./SystemUpdate.yaml"
  - type: object
    description: Update status for a Docker container image tracked via a GitHub repository.
    properties:
      type:
        type: string
        enum: [container]
      image:
        type: string
        description: Full container image reference (without tag) being tracked.
        example: "ghcr.io/dani-garcia/vaultwarden"
      device:
        type: string
        description: Identifier of the backend device running this container.
        example: "nas-1"
    required:
      - type
      - image
      - device
