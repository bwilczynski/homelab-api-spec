type: oauth2
description: |
  OAuth 2.0 bearer token issued by the homelab IdP (e.g. Pocket ID,
  Authelia). Agents obtain a token via the client-credentials flow
  and present it in the `Authorization: Bearer <token>` header. The
  homelab API validates the token, checks scopes, and exchanges it
  internally for whatever credentials each backend needs.

  Scopes follow the `<access>:<group>` convention where group matches
  the URL group segment (system, docker, storage, network).
flows:
  clientCredentials:
    tokenUrl: https://idp.homelab.local/oauth/token
    scopes:
      "read:system": Read system health, info, utilization, and software updates.
      "write:system": Trigger system-level actions (e.g. force update checks).
      "read:docker": List and inspect Docker containers and their resource usage.
      "write:docker": Start, stop, and restart Docker containers.
      "read:storage": Read storage volumes, disk health, and backup status.
      "write:storage": Manage storage resources and backups.
      "read:network": List and inspect network devices and connected clients.
      "write:network": Manage network devices and client configurations.
