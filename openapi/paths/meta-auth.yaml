get:
  operationId: getMetaAuth
  x-stability-level: draft
  summary: Get auth configuration
  description: |
    Returns the auth configuration for this API instance. Clients use
    this to determine whether authentication is required and which
    issuer to use before attempting to obtain a token. Public endpoint
    — no authentication required.
  tags:
    - meta
  security: []
  responses:
    "200":
      description: Auth configuration.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/meta/AuthDiscovery.yaml"
          examples:
            authEnabled:
              summary: Auth enforced against a homelab IdP.
              value:
                enabled: true
                issuer: "https://idp.homelab.local"
            authDisabled:
              summary: Auth disabled (trusted-network deployment). `issuer` omitted.
              value:
                enabled: false
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
