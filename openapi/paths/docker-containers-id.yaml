get:
  operationId: getContainer
  x-stability-level: draft
  summary: Get a container
  description: |
    Returns a single container by its composite identifier
    (`{deviceId}.{name}`, e.g. `nas-1.homeassistant`). The response
    includes current status, image, and live resource usage.
  tags:
    - docker
  security:
    - bearerAuth: [read:docker]
  parameters:
    - $ref: "../components/parameters/ContainerId.yaml"
  responses:
    "200":
      description: The requested container.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/docker/ContainerDetail.yaml"
          example:
            id: "nas-1.homeassistant"
            name: homeassistant
            device: nas-1
            status: running
            image: "ghcr.io/home-assistant/home-assistant:2025.4"
            restartCount: 0
            resources:
              cpuPercent: 2.5
              memoryBytes: 268435456
              memoryPercent: 6.4
            startedAt: "2026-04-08T19:46:34Z"
            exitCode: 0
            oomKilled: false
            restartPolicy: always
            privileged: false
            memoryLimit: 0
            portBindings:
              - containerPort: 8123
                hostPort: 8123
                protocol: tcp
            networks:
              - name: homeassistant_default
                driver: bridge
            volumeBindings:
              - source: /volume1/docker/homeassistant/config
                destination: /config
                mode: rw
            envVariables:
              - key: TZ
                value: Europe/Warsaw
            entrypoint: ["/init"]
            cmd: []
            labels:
              com.docker.compose.project: homeassistant
              com.docker.compose.service: homeassistant
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "404":
      $ref: "../components/responses/NotFound.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
