post:
  operationId: restartContainer
  summary: Restart a container
  description: |
    Restarts a container by stopping and then starting it. Works
    regardless of the container's current state.
  tags:
    - containers
  security:
    - bearerAuth: [write:containers]
  parameters:
    - name: containerId
      in: path
      required: true
      description: |
        Composite container identifier in the form `{deviceId}.{name}`
        (e.g. `nas-1.homeassistant`).
      schema:
        type: string
      example: "nas-1.homeassistant"
    - name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key to ensure the request is processed at most once.
      schema:
        type: string
      example: "b4f3c2a1-7e8d-4f5a-9c0b-1d2e3f4a5b6c"
  responses:
    "204":
      description: Container restarted.
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "404":
      $ref: "../components/responses/NotFound.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
