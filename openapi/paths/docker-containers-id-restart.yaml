post:
  operationId: restartContainer
  x-stability-level: draft
  summary: Restart a container
  description: |
    Restarts a container by stopping and then starting it. Works
    regardless of the container's current state.
  tags:
    - docker
  security:
    - bearerAuth: [write:docker]
  parameters:
    - $ref: "../components/parameters/ContainerId.yaml"
    - $ref: "../components/parameters/IdempotencyKey.yaml"
  responses:
    "204":
      description: Container restarted.
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "404":
      $ref: "../components/responses/NotFound.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
