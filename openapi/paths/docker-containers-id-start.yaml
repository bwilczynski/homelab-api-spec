post:
  operationId: startContainer
  x-stability-level: draft
  summary: Start a container
  description: |
    Starts a stopped or paused container. If the container is already
    running this is a no-op and still returns 204.
  tags:
    - docker
  security:
    - bearerAuth: [write:docker]
  parameters:
    - $ref: "../components/parameters/ContainerId.yaml"
    - $ref: "../components/parameters/IdempotencyKey.yaml"
  responses:
    "204":
      description: Container started (or was already running).
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "404":
      $ref: "../components/responses/NotFound.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
