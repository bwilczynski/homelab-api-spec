get:
  operationId: listSystemUpdates
  x-stability-level: draft
  summary: List tracked software updates
  description: |
    Returns all tracked software components and their update status.
    Each entry represents a component (container, firmware, application)
    that is monitored for newer versions.

    Use the `status` parameter to filter for actionable items (e.g.
    `?status=updateAvailable`). Use `type` to narrow by component kind.

    The server checks upstream sources periodically and caches results.
    The `checkedAt` field indicates freshness of the version information.
  tags:
    - system
  security:
    - bearerAuth: [read:system]
  parameters:
    - $ref: "../components/parameters/UpdateStatusFilter.yaml"
    - $ref: "../components/parameters/UpdateTypeFilter.yaml"
  responses:
    "200":
      description: List of tracked software components and their update status.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/SystemUpdateList.yaml"
          examples:
            mixedStatus:
              summary: Some containers up to date, some with updates available.
              value:
                items:
                  - id: "nas-1.vaultwarden"
                    name: "vaultwarden"
                    type: container
                    status: updateAvailable
                    device: "nas-1"
                    currentVersion: "1.32.7"
                    latestVersion: "1.34.0"
                    checkedAt: "2026-04-28T08:30:00Z"
                  - id: "nas-1.immich-server"
                    name: "immich-server"
                    type: container
                    status: upToDate
                    device: "nas-1"
                    currentVersion: "v1.120.0"
                    latestVersion: "v1.120.0"
                    checkedAt: "2026-04-28T08:30:00Z"
                  - id: "nas-1.grafana"
                    name: "grafana"
                    type: container
                    status: updateAvailable
                    device: "nas-1"
                    currentVersion: "11.4.0"
                    latestVersion: "11.5.2"
                    checkedAt: "2026-04-28T08:30:00Z"
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
