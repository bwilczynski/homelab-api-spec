get:
  operationId: getMetaVersion
  x-stability-level: draft
  summary: Get API and server version
  description: |
    Returns the version of the OpenAPI contract this server implements
    and the build version of the server binary. Public endpoint — no
    authentication required.
  tags:
    - meta
  security: []
  responses:
    "200":
      description: Version information.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/meta/Version.yaml"
          examples:
            release:
              summary: Server running a tagged release.
              value:
                apiVersion: "1.1.0"
                serverVersion: "0.4.2"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
