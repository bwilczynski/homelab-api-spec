get:
  operationId: getBackup
  x-stability-level: draft
  summary: Get a backup
  description: |
    Returns a single backup by its composite identifier
    (`{deviceId}.{backupId}`, e.g. `nas-1.1`). The response includes
    current status, the outcome of the most recent run, and scheduling
    information (last and next run times).
  tags:
    - storage
  security:
    - bearerAuth: [read:storage]
  parameters:
    - name: backupId
      in: path
      required: true
      description: |
        Composite backup identifier in the form `{deviceId}.{backupId}`
        (e.g. `nas-1.1`). The device prefix disambiguates backups across
        multiple backends.
      schema:
        type: string
      example: "nas-1.1"
  responses:
    "200":
      description: The requested backup.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/BackupTaskDetail.yaml"
          example:
            id: "nas-1.1"
            name: "Daily NAS Backup"
            device: nas-1
            type: hyperBackup
            status: idle
            lastResult: success
            lastRunAt: "2026-04-16T03:00:00Z"
            nextRunAt: "2026-04-17T03:00:00Z"
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "404":
      $ref: "../components/responses/NotFound.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
