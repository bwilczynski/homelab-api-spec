get:
  operationId: listBackupTasks
  summary: List backup tasks
  description: |
    Returns backup tasks from all configured NAS backends. Each task
    includes its current status, the outcome of the most recent run,
    and when it last ran and is next scheduled to run.

    Use the `device` query parameter to filter tasks from a specific
    backend (e.g. `?device=nas-1`). Omit it to get tasks across all
    devices.

    A homelab typically has a handful of backup tasks, so this endpoint
    returns all matching results without pagination.
  tags:
    - backups
  security:
    - bearerAuth: [read:backups]
  parameters:
    - $ref: "../components/parameters/DeviceFilter.yaml"
  responses:
    "200":
      description: List of backup tasks.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/BackupTaskList.yaml"
          examples:
            mixedBackups:
              summary: Hyper Backup and Glacier tasks on a single NAS.
              value:
                items:
                  - id: "nas-1.1"
                    name: "Daily NAS Backup"
                    device: nas-1
                    type: hyperBackup
                    status: idle
                    lastResult: success
                    lastRunAt: "2026-04-16T03:00:00Z"
                    nextRunAt: "2026-04-17T03:00:00Z"
                  - id: "nas-1.2"
                    name: "Weekly Offsite"
                    device: nas-1
                    type: hyperBackup
                    status: idle
                    lastResult: failed
                    lastRunAt: "2026-04-13T04:00:00Z"
                    nextRunAt: "2026-04-20T04:00:00Z"
                  - id: "nas-1.3"
                    name: "Photos Glacier Archive"
                    device: nas-1
                    type: glacierBackup
                    status: idle
                    lastResult: success
                    lastRunAt: "2026-04-15T02:00:00Z"
                    nextRunAt: "2026-04-22T02:00:00Z"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
