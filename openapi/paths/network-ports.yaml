get:
  operationId: listNetworkPorts
  x-stability-level: draft
  summary: List switch ports across all switches
  description: |
    Returns physical ports from every managed switch across all configured
    UniFi controllers as a single flat list. Each port carries a reference
    to its parent switch so consumers can audit VLAN policy, PoE state,
    LAG membership, and connected endpoints without fanning out one call
    per switch.

    A homelab typically has a small number of switches (each with tens of
    ports), so this endpoint returns all results without pagination.
    Result order is not guaranteed; clients should sort as needed.

    Filters are AND-composed and applied server-side; any combination is
    valid. Ports without a `vlanConfig` (either administratively disabled
    or when the controller does not report enough data to resolve the
    native VLAN) never match the `mode` or `vlanId` filters.
  tags:
    - network
  security:
    - bearerAuth: [read:network]
  parameters:
    - $ref: "../components/parameters/DeviceIdFilter.yaml"
    - $ref: "../components/parameters/DevicePortModeFilter.yaml"
    - $ref: "../components/parameters/NetworkPortStateFilter.yaml"
    - $ref: "../components/parameters/VlanIdFilter.yaml"
  responses:
    "200":
      description: List of switch ports across all switches.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/network/NetworkPortList.yaml"
          examples:
            typicalHomelab:
              summary: One switch, four ports (trunk uplink, trunk AP downlink, idle access port, access LAG member).
              value:
                items:
                  - number: 1
                    state: up
                    linkSpeed: gbe1
                    linkUptime: 172800
                    poeMode: 'off'
                    vlanConfig:
                      mode: trunk
                      nativeVlan:
                        id: "unifi.default"
                        uri: "/network/vlans/unifi.default"
                        name: "Default"
                        vlanId: 1
                      taggedVlans:
                        scope: all
                    traffic:
                      rxBytesTotal: 43980465111
                      txBytesTotal: 87960930222
                      rxBytesPerSec: 600000
                      txBytesPerSec: 1250000
                    connectedTo:
                      kind: device
                      id: "unifi.usg"
                      uri: "/network/devices/unifi.usg"
                      name: "USG"
                    switch:
                      kind: device
                      id: "unifi.switch-living-room"
                      uri: "/network/devices/unifi.switch-living-room"
                      name: "Switch Living Room"
                  - number: 7
                    label: "AP Living Room uplink"
                    state: up
                    linkSpeed: gbe2_5
                    linkUptime: 86400
                    poeMode: auto
                    poePowerWatts: 4.5
                    vlanConfig:
                      mode: trunk
                      nativeVlan:
                        id: "unifi.default"
                        uri: "/network/vlans/unifi.default"
                        name: "Default"
                        vlanId: 1
                      taggedVlans:
                        scope: custom
                        items:
                          - id: "unifi.iot"
                            uri: "/network/vlans/unifi.iot"
                            name: "IoT"
                            vlanId: 20
                    traffic:
                      rxBytesTotal: 12884901888
                      txBytesTotal: 4294967296
                      rxBytesPerSec: 125000
                      txBytesPerSec: 50000
                    connectedTo:
                      kind: device
                      id: "unifi.ap-living-room"
                      uri: "/network/devices/unifi.ap-living-room"
                      name: "AP Living Room"
                    switch:
                      kind: device
                      id: "unifi.switch-living-room"
                      uri: "/network/devices/unifi.switch-living-room"
                      name: "Switch Living Room"
                  - number: 2
                    state: down
                    poeMode: 'off'
                    vlanConfig:
                      mode: access
                      nativeVlan:
                        id: "unifi.servers"
                        uri: "/network/vlans/unifi.servers"
                        name: "Servers"
                        vlanId: 100
                    traffic:
                      rxBytesTotal: 0
                      txBytesTotal: 0
                      rxBytesPerSec: 0
                      txBytesPerSec: 0
                    switch:
                      kind: device
                      id: "unifi.switch-living-room"
                      uri: "/network/devices/unifi.switch-living-room"
                      name: "Switch Living Room"
                  - number: 8
                    state: up
                    linkSpeed: gbe10
                    linkUptime: 3600
                    sfpModulePresent: true
                    poeMode: 'off'
                    lagMembership:
                      id: 8
                      role: master
                    vlanConfig:
                      mode: access
                      nativeVlan:
                        id: "unifi.servers"
                        uri: "/network/vlans/unifi.servers"
                        name: "Servers"
                        vlanId: 100
                    traffic:
                      rxBytesTotal: 5497558138
                      txBytesTotal: 2748779069
                      rxBytesPerSec: 800000
                      txBytesPerSec: 100000
                    connectedTo:
                      kind: client
                      id: "unifi.nas-1-68"
                      uri: "/network/clients/unifi.nas-1-68"
                      name: "nas-1"
                    switch:
                      kind: device
                      id: "unifi.switch-living-room"
                      uri: "/network/devices/unifi.switch-living-room"
                      name: "Switch Living Room"
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "429":
