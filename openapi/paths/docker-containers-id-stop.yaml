post:
  operationId: stopContainer
  x-stability-level: draft
  summary: Stop a container
  description: |
    Stops a running container gracefully. If the container is already
    stopped this is a no-op and still returns 204.
  tags:
    - docker
  security:
    - bearerAuth: [write:docker]
  parameters:
    - $ref: "../components/parameters/ContainerId.yaml"
    - $ref: "../components/parameters/IdempotencyKey.yaml"
  responses:
    "204":
      description: Container stopped (or was already stopped).
    "400":
      $ref: "../components/responses/BadRequest.yaml"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "404":
      $ref: "../components/responses/NotFound.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
