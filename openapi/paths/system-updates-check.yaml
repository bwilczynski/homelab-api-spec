post:
  operationId: checkSystemUpdates
  x-stability-level: draft
  summary: Check for available updates
  description: |
    Forces an immediate check against all upstream sources for newer
    versions. Unlike `GET /system/updates` which returns cached results,
    this action actively queries each upstream source (e.g. GitHub
    releases API) and refreshes the stored version information.

    Returns the full updated list after the check completes. The
    `checkedAt` timestamps will reflect the current time.

    This operation may take several seconds depending on the number of
    tracked components and upstream response times.
  tags:
    - system
  security:
    - bearerAuth: [write:system]
  parameters:
    - name: Idempotency-Key
      in: header
      required: false
      description: Client-generated key to ensure the request is processed at most once.
      schema:
        type: string
      example: "b4f3c2a1-7e8d-4f5a-9c0b-1d2e3f4a5b6c"
  responses:
    "200":
      description: Updated list of tracked components after checking upstream sources.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/SystemUpdateList.yaml"
          examples:
            afterCheck:
              summary: Results after a fresh check against upstream sources.
              value:
                items:
                  - id: "nas-1.vaultwarden"
                    name: "Vaultwarden"
                    type: container
                    status: updateAvailable
                    currentVersion: "1.32.7"
                    latestVersion: "1.34.0"
                    checkedAt: "2026-04-28T12:00:00Z"
                  - id: "nas-1.immich"
                    name: "Immich"
                    type: container
                    status: upToDate
                    currentVersion: "v1.120.0"
                    latestVersion: "v1.120.0"
                    checkedAt: "2026-04-28T12:00:00Z"
                  - id: "nas-1.grafana"
                    name: "Grafana"
                    type: container
                    status: updateAvailable
                    currentVersion: "11.4.0"
                    latestVersion: "11.5.2"
                    checkedAt: "2026-04-28T12:00:00Z"
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
