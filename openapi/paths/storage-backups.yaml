get:
  operationId: listBackups
  x-stability-level: draft
  summary: List backups
  description: |
    Returns backups from all configured NAS backends. Each backup
    includes its current status, the outcome of the most recent run,
    and when it last ran and is next scheduled to run.

    Use the `device` query parameter to filter backups from a specific
    backend (e.g. `?device=nas-1`). Omit it to get backups across all
    devices.

    A homelab typically has a handful of backups, so this endpoint
    returns all matching results without pagination.
  tags:
    - storage
  security:
    - bearerAuth: [read:storage]
  parameters:
    - $ref: "../components/parameters/DeviceFilter.yaml"
  responses:
    "200":
      description: List of backups.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/BackupTaskList.yaml"
          examples:
            mixedBackups:
              summary: Hyper Backup and Glacier tasks on a single NAS.
              value:
                items:
                  - id: "nas-1.1"
                    name: "Daily NAS Backup"
                    device: nas-1
                    type: hyperBackup
                    status: idle
                    lastResult: success
                  - id: "nas-1.2"
                    name: "Weekly Offsite"
                    device: nas-1
                    type: hyperBackup
                    status: idle
                    lastResult: failed
                  - id: "nas-1.3"
                    name: "Photos Glacier Archive"
                    device: nas-1
                    type: glacierBackup
                    status: idle
                    lastResult: success
    "401":
      $ref: "../components/responses/Unauthorized.yaml"
    "403":
      $ref: "../components/responses/Forbidden.yaml"
    "429":
      $ref: "../components/responses/TooManyRequests.yaml"
    "500":
      $ref: "../components/responses/InternalServerError.yaml"
