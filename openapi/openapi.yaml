openapi: 3.0.3
info:
  title: Homelab API
  version: 0.1.0
  description: |
    Contract-first API exposing homelab infrastructure operations to AI
    agents and tooling. The Homelab API provides a unified surface over
    heterogeneous homelab backends (UniFi, Synology, Docker). The API
    acts as a credential broker: clients authenticate with a bearer token
    against an IdP, and the server exchanges that token for whatever
    credentials each backend needs.

    This document is the source of truth. Server stubs, CLI, and MCP
    tools are generated or validated against the bundled spec.
  contact:
    name: Bartlomiej Wilczynski
    url: https://github.com/bwilczynski/homelab-api-spec
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://homelab.local/api
    description: Homelab gateway (default deployment).

tags:
  - name: system
    description: System health, info, utilization, and software updates.
  - name: docker
    description: Docker containers and their resource usage across backends.
  - name: storage
    description: Storage volumes, disk health, and backups across NAS backends.
  - name: network
    description: Network devices and connected clients from UniFi controllers.

security:
  - bearerAuth: []

paths:
  /system/health:
    $ref: "./paths/system-health.yaml"
  /system/info:
    $ref: "./paths/system-info.yaml"
  /system/utilization:
    $ref: "./paths/system-utilization.yaml"
  /system/updates:
    $ref: "./paths/system-updates.yaml"
  /system/updates/{updateId}:
    $ref: "./paths/system-updates-id.yaml"
  "/system/updates:check":
    $ref: "./paths/system-updates-check.yaml"
  /storage/volumes:
    $ref: "./paths/storage-volumes.yaml"
  /storage/volumes/{volumeId}:
    $ref: "./paths/storage-volumes-id.yaml"
  /docker/containers:
    $ref: "./paths/docker-containers.yaml"
  /docker/containers/{containerId}:
    $ref: "./paths/docker-containers-id.yaml"
  "/docker/containers/{containerId}:start":
    $ref: "./paths/docker-containers-id-start.yaml"
  "/docker/containers/{containerId}:stop":
    $ref: "./paths/docker-containers-id-stop.yaml"
  "/docker/containers/{containerId}:restart":
    $ref: "./paths/docker-containers-id-restart.yaml"
  /storage/backups:
    $ref: "./paths/storage-backups.yaml"
  /storage/backups/{backupId}:
    $ref: "./paths/storage-backups-id.yaml"
  /network/devices:
    $ref: "./paths/network-devices.yaml"
  /network/devices/{deviceId}:
    $ref: "./paths/network-devices-id.yaml"
  /network/clients:
    $ref: "./paths/network-clients.yaml"
  /network/clients/{clientId}:
    $ref: "./paths/network-clients-id.yaml"

components:
  securitySchemes:
    bearerAuth:
      $ref: "./components/securitySchemes/BearerAuth.yaml"
